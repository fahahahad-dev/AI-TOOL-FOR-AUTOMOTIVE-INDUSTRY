meta:
    # The version of this compiler database
    version: "2.2.0"


compilers:
    ti_base: &ti_base
        version:
            command:
                - "--compiler_revision"
            channel: stdout
            match_expr:
                '(?P<version>.*)'
        macros:
            command:
                - "-ppm"
            tempfile:
                "/* Temporary file for pclp_config */\n"
            channel:
                tempfile_derived:
                    - ["(\\.[^.\\\\/]+)?\\.[cp]+$", ".pp"]
            tempfile_associated:
                - ["(\\.[^.\\\\/]+)?\\.[cp]+$", ".pp"]
        size_options:
            command:
                - "-ppo"
            tempfile: |
                #define STR1(p) #p
                #define STR(p) STR1(p)
                #define JOIN1(a,b) a##b
                #define JOIN(a,b) JOIN1(a,b)

                #if __SIZEOF_SIZE_T__ == __SIZEOF_LONG__
                #  define FZL_OPT +fzl
                #elif __SIZEOF_SIZE_T__ == __SIZEOF_LONG_LONG__
                #  define FZL_OPT +fzl ++fzl
                #else
                #  define FZL_OPT
                #endif

                #if defined(__CHAR_BIT__)
                #  define SB_OPT JOIN(-sb,__CHAR_BIT__)
                #else
                #  define SB_OPT
                #endif

                (STR( \
                    SB_OPT \
                    JOIN(-si, __SIZEOF_INT__) \
                    JOIN(-sl, __SIZEOF_LONG__) \
                    JOIN(-sll,__SIZEOF_LONG_LONG__) \
                    JOIN(-ss, __SIZEOF_SHORT__) \
                    JOIN(-sw, __SIZEOF_WCHAR_T__) \
                    JOIN(-sp, __SIZEOF_SIZE_T__) \
                    JOIN(-sf, __SIZEOF_FLOAT__) \
                    JOIN(-sd, __SIZEOF_DOUBLE__) \
                    JOIN(-sld,__SIZEOF_LONG_DOUBLE__) \
                    FZL_OPT \
                ) )

            channel:
                tempfile_derived:
                    - ["(\\.[^.\\\\/]+)?\\.[cp]+$", ".pp"]
            tempfile_associated:
                - ["(\\.[^.\\\\/]+)?\\.[cp]+$", ".pp"]
            match_expr: '\("(?P<size_options>.+?)"'
        options:
            '--include_path':
                transforms: [ ['--include_path(?:\s+|[=])?(?:["](?P<dir>.+)["]|(?P<dir>.+))', '-i"\g<dir>"'] ]
            '-I':
                transforms: [ ['-I(?:\s+|[=])?(?:["](?P<dir>.+)["]|(?P<dir>.+))', '-i"\g<dir>"'] ]
            '-i':
                transforms: [ ['-i(?:\s+|[=])?(?:["](?P<dir>.+)["]|(?P<dir>.+))', '-i"\g<dir>"'] ]
        base_config: &ti_base_config
            extensions:
                - [ "+ppw(include_next)", "Enable support for #include_next" ]
                - [ "+rw(__interrupt)", "" ]
                - [ "+rw(__near)", "" ]
                - [ "+rw(__far)", "" ]
                - [ "+rw(__cregister)", "" ]

    ti_cl430:
        <<: *ti_base
        description: "TI Code Composer Studio - TI cl430"
        c_include_paths:
            compiler_relative:
                - ["^(.+)[\\\\/]bin[\\\\/][^\\\\/]+$", "\\1/include"]
        cpp_include_paths:
            compiler_relative:
                - ["^(.+)[\\\\/]bin[\\\\/][^\\\\/]+$", "\\1/include/libcxx"]
                - ["^(.+)[\\\\/]bin[\\\\/][^\\\\/]+$", "\\1/include"]

    ti_cl2000:
