                - ['-rw_asgn(__volatile,volatile)', '']
                - ['-rw_asgn(__alignof__,__alignof)', '']
                - ['++d__builtin_speculation_safe_load(ptr,lwr,upr,cmp)=(*(ptr))', '']
                - ['++dassert(x)=__lint_assert(!!(x))', '']
            suppressions:
                - ['-emacro(530, va_start)', '']
                - ['-emacro(530, va_end)', '']
                - ['-emacro(413, offsetof)', '']
                - ['-efile(4397, -stdint.h, -wchar.h, -limits)', '']
                - ['-efile(1013, -cstdio)', '']
                - ['-efile(5389, -unordered_map)', '']
                - ['-efile(13 104, -uchar.h)', '']
                - ['-efile(31, -atomic_ghs.h)', '']
                - ['-esym(4376,__gh_va_arg)', '']
        version:
            command:
                - "-V"
                - "-S"
            tempfile_associated:
                - ["(\\.[^\\\\/]+)?\\.c$", ".s"]
                - ["^.*[\\\\/]([^\\\\/]+)(?:\\.[^.\\\\/]+)?\\.c$", "\\1.s"]
            tempfile:   "/* Temporary file for pclp_config */\n"
            channel: stderr
            match_expr:
                '^(?P<version>.+)\sRELEASE VERSION'
        size_options:
            command:
                - "-S"
            tempfile_associated:
                - ["(\\.[^.\\\\/]+)?\\.c$", ".s"]
                - ["^.*[\\\\/]([^\\\\/]+)(?:\\.[^.\\\\/]+)?\\.c$", "\\1.s"]
            tempfile: |
                typedef int si;
                si  (*si_)[sizeof(int)] = 1;

                typedef short ss;
                ss  (*ss_)[sizeof(short)] = 1;

                typedef long sl;
                sl  (*sl_)[sizeof(long)] = 1;

                typedef long long sll;
                sll (*sll_)[sizeof(long long)] = 1;

                typedef float sf;
                sf  (*sf_)[sizeof(float)] = 1;

                typedef double sd;
                sd  (*sd_)[sizeof(double)] = 1;

                typedef long double sld;
                sld (*sld_)[sizeof(long double)] = 1;

                typedef char* sp;
                sp  (*sp_)[sizeof(char *)] = 1;

                typedef char sw;
                sw  (*sw_)[sizeof(L'a')] = 1;
            channel: stderr
            match_expr: >-
                (?:.*?['"](?P<size_name>si|sl|sll|ss|sw|sp|sf|sd|sld)[ (*)[]+(?P<size_value>\d+)\]['"])+
        c_include_paths:
            command:
                - "-#"
                - "-S"
            tempfile_associated:
                - ["(\\.[^.\\\\/]+)?\\.[cp]+$", ".s"]
            tempfile_type: "c"
            tempfile:   "/* Temporary file for pclp_config */\n"
            channel:    stdout
            # Green Hills Software requires that the installation directories must not contain any spaces.
            match_expr: '(?:.*?[-]+(?:sys_include|cxx_include_directory|c_include_directory|include_no_mmd|I|rtos_include_directory|std_cxx_include_directory|sys_include_directory)[ =]?(?P<include_dir>[^ ]+) )+'
        c_macros:
            # New macro extraction method
            command:
                - "-dM"
                - "-E"
            tempfile_associated:
                - ["(\\.[^.\\\\/]+)?\\.[cp]+$", ".s"]
            tempfile_type: "c"
            tempfile:   "/* Temporary file for pclp_config */\n"
            channel:    stdout
            match_expr: '(?P<macros>#define.*)'
            # Old macro extraction method
            command1:
                - "-#"
                - "-S"
            tempfile_associated1:
                - ["(\\.[^.\\\\/]+)?\\.[cp]+$", ".s"]
            tempfile_type1: "c"
            tempfile1:  "/* Temporary file for pclp_config */\n"
            channel1:   stdout
            transforms1:    [ ['-D(?P<name>[\w]+)=(?P<value>[^ ]+) ', '\n#define \g<name> \g<value>\n'],
                              ['-D(?P<name>[\w]+) ', '\n#define \g<name> 1\n'],
                              ['\\', '']
                            ]
            match_expr1: '(?P<macros>#define.*)'

    ghs: # Mixed C++ and C
        description: "Green Hills Software C/C++ compilers"
        <<: *ghs_common
        cpp_include_paths:
            command:
                - "-#"
                - "-S"
            tempfile_associated:
                - ["(\\.[^.\\\\/]+)?\\.[cp]+$", ".s"]
            tempfile_type: "cpp"
            tempfile:   "/* Temporary file for pclp_config */\n"
            channel:    stdout
            # Green Hills Software requires that the installation directories must not contain any spaces.
            match_expr: '(?:.*?[-]+(?:sys_include|cxx_include_directory|c_include_directory|include_no_mmd|I|rtos_include_directory|std_cxx_include_directory|sys_include_directory)[ =]?(?P<include_dir>[^ ]+) )+'
        cpp_macros:
            # New macro extraction method
            command:
                - "-dM"
                - "-E"
            tempfile_associated:
                - ["(\\.[^.\\\\/]+)?\\.[cp]+$", ".s"]
            tempfile_type: "cpp"
            tempfile:   "/* Temporary file for pclp_config */\n"
            channel:    stdout
            match_expr: '(?P<macros>#define.*)'
            # Old macro extraction method
            command1:
                - "-#"
                - "-S"
            tempfile_associated1:
                - ["(\\.[^.\\\\/]+)?\\.[cp]+$", ".s"]
            tempfile_type1: "cpp"
            tempfile1:  "/* Temporary file for pclp_config */\n"
            channel1:   stdout
            transforms1:    [ ['-D(?P<name>[\w]+)=(?P<value>[^ ]+) ', '\n#define \g<name> \g<value>\n'],
                              ['-D(?P<name>[\w]+) ', '\n#define \g<name> 1\n'],
                              ['\\', '']
                            ]
            match_expr1: '(?P<macros>#define.*)'

    ghs_c:  # C only
        <<: *ghs_common
        description: "Green Hills Software C compilers"

    cc1: &cc1
        description: "GNU cc1"
        version: &cc1_version
          <<: *gcc_version
          command:
              - "-version"
        include_paths: &cc1_include_paths
            <<: *gcc_c_include_paths
            command:
                - "-E"
                - "-v"
                - "-"
        c_macros: &cc1_macros
            <<: *gcc_c_macros
            command:
                - "-E"
                - "-dM"
                - "-"
            scavenge_command:
                - "-E"
                - "-"
        size_options: &cc1_size_options
            <<: *gcc_size_options
            input_type_option_c: null
            input_type_option_cpp: null
            input_type_option_default: null
        c_decls: *gcc_c_decls
        base_config:
            extensions: *gcc_base_config_extensions
            suppressions: *gcc_base_config_suppressions
        options:
            # The list of options used by the compiler.
            #
            # The 'handled' options are those that have corresponding Lint options and instructions
            # on how to convert the compiler option to the appropriate lint option.

            # The 'unsupported' options include those that could potentially have an effect on the
            # linting process if they were supported but are currently ignored because the corresponding
            # behavior is not implemented in Lint.
            #
            # Options not found in these areas are considered irrelevant, as they do not affect
            # the linting process.

            # Handled Options:
            '--ansi':
                transform: '-std=c90'
            '-ansi':
                transform: '-std=c90'
            '-std=c89':
                transform: '-std=c89'
            '-std=c90':
                transform: '-std=c90'
            '-std=c99':
                transform: '-std=c99'
            '-std=c11':
                transform: '-std=c11'
            '-std=c9x':
                transform: '-std=c99'
            '-std=c1x':
                transform: '-std=c11'
            '-std=iso9899:1990':
                transform: '-std=c90'
            '-std=iso9899:199409':
                transform: '-std=c90'
            '-std=iso9899:1999':
                transform: '-std=c99'
            '-std=iso9899:199x':
                transform: '-std=c99'
            '-std=iso9899:2011':
                transform: '-std=c11'
            '-std=gnu89':
                transform: '-std=c89'
            '-std=gnu90':
                transform: '-std=c90'
            '-std=gnu99':
                transform: '-std=c99'
            '-std=gnu9x':
                transform: '-std=c99'
            '-std=gnu11':
                transform: '-std=c11'
            '-std=gnu1x':
                transform: '-std=c11'
            '-std=gnu++98':
                transform: '-std=c++03'
            '-D':
