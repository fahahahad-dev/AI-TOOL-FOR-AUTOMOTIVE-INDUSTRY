    microchip_xc8:
        description: "Microchip XC8 xc8-gcc"
        version:
            command:
                - "--version"
            channel:    stdout
            match_expr:
                '(?i)(?P<version>microchip[^\n]+)\n'
        size_options:
            # To obtain the size of the fundamental types, the compiler is invoked with the arguments
            # provided below and the source file below is fed to the compiler via stdin.  The output
            # from the compiler will be the preprocessed source which will contain the desired size
            # options which will be extracted from the output via the regular expression 'match_expr'.
            command:
                - "--PRE"
            tempfile_associated:
                - ["(\\.[^\\\\/]+)?\\.[cp]+$", ".d"]
                - ["^.*[\\\\/]([^\\\\/]+)(\\.[^.\\\\/]+)?\\.[cp]+$", "\\1.d"]
            tempfile_type_c:    "c"
            tempfile_type_cpp:  "cpp"
            tempfile: |
                int si  = __SIZEOF_INT__;
                int ss  = __SIZEOF_SHORT__;
                int sl  = __SIZEOF_LONG__;
                int sf  = __SIZEOF_FLOAT__;
                int sd  = __SIZEOF_DOUBLE__;
                int sld = __SIZEOF_LONG_DOUBLE__;
                #ifdef __SIZEOF_POINTER__
                int sp  = __SIZEOF_POINTER__;
                #endif
                #ifdef __SIZEOF_LONG_LONG__
                int sll = __SIZEOF_LONG_LONG__;
                #endif
                #ifdef __SIZEOF_WCHAR_T__
                int sw  = __SIZEOF_WCHAR_T__;
                #endif
            channel:    stdout
            match_expr: '(?:.*?int\s+(?P<size_name>si|sl|sll|ss|sw|sp|sf|sd|sld)\s?=\s?+(?P<size_value>\d+);)+'
            fallback_values: '-ss2 -si2 -sl4 -sll4 -sf3 -sd3 -sld3'
        include_paths:
            compiler_relative:
                - ["^(.+)[\\\\/]bin[\\\\/][^\\\\/]+$", "\\1/pic/include"]
                # We assume C99, if C90 is required: uncomment the 'c90' line & comment the 'c99' line below
#                - ["^(.+)[\\\\/]bin[\\\\/][^\\\\/]+$", "\\1/pic/include/c90"]
                - ["^(.+)[\\\\/]bin[\\\\/][^\\\\/]+$", "\\1/pic/include/c99"]
                - ["^(.+)[\\\\/]bin[\\\\/][^\\\\/]+$", "\\1/pic/include/proc"]
                - ["^(.+)[\\\\/]bin[\\\\/][^\\\\/]+$", "\\1/pic/include/legacy"]
        decls:
            definitions:
                - 'int __builtin_clz (unsigned x);'
                - 'int __builtin_ctz (unsigned x);'
                - 'void __builtin_mips_cache (int, const volatile void *);'
        base_config:
            extensions: *gcc_base_config_extensions
            suppressions: *gcc_base_config_suppressions
            xc_extensions: *microchip_xc_base_config_xc_extensions
            xc8_extensions:
                - ['+fcu','']
                - ['-d"__int24=signed _BitInt(24)"', '']
                - ['-d"__uint24=unsigned _BitInt(24)"', '']
                - ['-d"__bit=unsigned _BitInt(1)"', '']
                - ['+rw(__bank0)','']
                - ['+rw(__bank1)','']
                - ['+rw(__bank2)','']
                - ['+rw(__bank3)','']
                - ['+rw(__bank4)','']
                - ['+rw(__bank5)','']
                - ['+rw(__bank6)','']
                - ['+rw(__bank7)','']
                - ['+rw(__nonreentrant)', '']
        macros:
            command:
                - "--PRE"
                - "-ext=iar"
            channel:        stdout
            transforms: [
                    # Translate xc8-cc quoted value macros
                    ['#pragma message\("#DEF[\s]+(?P<name>[\w]+)[\s]+\\042(?P<value>[^"]+)\\042"\)', '#define \g<name> "\g<value>"'],
                    # Translate xc8-cc unquoted value macros
                    ['#pragma message\("#DEF[\s]+(?P<name>[\w]+)[\s]+(?P<value>[^"]+)"\)', '#define \g<name> \g<value>'],
                    # Translate xc8 macros
                    ['#pragma message\("#DEF[\s"]+(?P<name>[\w]+)[\s"]+(?P<value>[^"]+)"\)', '#define \g<name> \g<value>'],
                    # Translate remaining octal escape format double-quotes
                    ['\\042', '"'],
                ]
            match_expr: '(?P<macros>#define.*)+'
            tempfile_associated:
                - ["(\\.[^\\\\/]+)?\\.[cp]+$", ".d"]
                - ["^.*[\\\\/]([^\\\\/]+)(\\.[^.\\\\/]+)?\\.[cp]+$", "\\1.d"]
            tempfile_type: "c"
            tempfile_header: |
                #define S2(x) #x
                #define S1(x) S2(x)
                #define DV(x) "#DEF " #x " " S1(x)
                /* */
            tempfile_transform: [
                    # For each general macro NAME generate the following:
                    #   #ifdef NAME
                    #       #pragma message(DV(NAME))
                    #   #endif
                    ['^(?P<NAME>[^:].+)$', '#ifdef \g<NAME>\n  #pragma message(DV(\g<NAME>))\n#endif\n'],
                    # For each chip macro NAME (item starts with a colon ':') generate the following:
                    #   #ifdef _NAME
                    #       #pragma message(DV(_NAME))
                    #   #endif
                    #   #ifdef __NAME
                    #       #pragma message(DV(__NAME))
                    #   #endif
                    #   #ifdef __NAME__
                    #       #pragma message(DV(__NAME__))
                    #   #endif
                    ['^:(?P<NAME>.+)$', '#ifdef _\g<NAME>\n  #pragma message(DV(_\g<NAME>))\n#endif\n#ifdef __\g<NAME>\n  #pragma message(DV(__\g<NAME>))\n#endif\n#ifdef __\g<NAME>__\n  #pragma message(DV(__\g<NAME>__))\n#endif\n'],
                ]
            tempfile_footer: ""
            tempfile_items:
