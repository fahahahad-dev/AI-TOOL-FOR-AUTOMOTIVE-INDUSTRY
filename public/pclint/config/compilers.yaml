    segger-cc: &segger-cc
        description: "SEGGER C/C++ compiler"
        version:
            command:
                - "--version"
            channel:    stdout
            match_expr:
                'SEGGER compiler version\s+(?P<version>\d+\.\d+\.\d+)'
        c_macros:
            command:
                - "-xc"
                - "-E"
                - "-dM"
            tempfile_type: "c"
            tempfile:  "/* Temporary file for pclp_config */\n"
            channel:    stdout
            match_expr_macros: '(?P<macros>.*)'
        cpp_macros:
            command:
                - "-xc++"
                - "-E"
                - "-dM"
            tempfile_type: "cpp"
            tempfile:  "/* Temporary file for pclp_config */\n"
            channel:    stdout
            match_expr_macros: '(?P<macros>.*)'
        c_include_paths:
            command:
                - "-v"
                - "-xc"
            tempfile_type: "c"
            tempfile:  "/* Temporary file for pclp_config */\n"
            channel:    stderr
            match_expr: 'search starts here:[\r\n]+(?:\s*(?:(?P<include_dir>[^#\r\n]*?)(?:\(framework directory\))?[\r\n]+)*)End of search list'
        cpp_include_paths:
            command:
                - "-v"
                - "-xc++"
            tempfile_type: "cpp"
            tempfile:  "/* Temporary file for pclp_config */\n"
            channel:    stderr
            match_expr: 'search starts here:[\r\n]+(?:\s*(?:(?P<include_dir>[^#\r\n]*?)(?:\(framework directory\))?[\r\n]+)*)End of search list'
        size_options:
            command:
                - "-E"
            input_type_option_c:        "-xc"
            input_type_option_cpp:      "-xc++"
            input_type_option_default:  "-xc"
            input: |
                #define STR1(p) #p
                #define STR(p) STR1(p)
                #define JOIN1(a,b) a##b
                #define JOIN(a,b) JOIN1(a,b)

                #if __SIZEOF_SIZE_T__ == __SIZEOF_LONG__
                #  define FZL_OPT +fzl
                #elif __SIZEOF_SIZE_T__ == __SIZEOF_LONG_LONG__
                #  define FZL_OPT +fzl ++fzl
                #else
                #  define FZL_OPT
                #endif

                #pragma message(STR( \
                                      JOIN(-si, __SIZEOF_INT__) \
                                      JOIN(-sl, __SIZEOF_LONG__) \
                                      JOIN(-sll,__SIZEOF_LONG_LONG__) \
                                      JOIN(-ss, __SIZEOF_SHORT__) \
                                      JOIN(-sw, __SIZEOF_WCHAR_T__) \
                                      JOIN(-sp, __SIZEOF_POINTER__) \
                                      JOIN(-sf, __SIZEOF_FLOAT__) \
                                      JOIN(-sd, __SIZEOF_DOUBLE__) \
                                      JOIN(-sld,__SIZEOF_LONG_DOUBLE__) \
                                      FZL_OPT \
                                    ) )

            channel:    stdout
            match_expr: 'message\("(?P<size_options>.+?)"'
