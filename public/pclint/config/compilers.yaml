    clang: &clang
        <<: *gcc
        description: "Compiler frontend for LLVM"

    vs_base: &vs_base
        version:
            command: []
            channel:    stderr
            match_expr:
                'Version\s+(?P<version>\d+\.\d+\.\d+)'
        include_paths:
            env_var: 'INCLUDE'
            match_expr: '(?:(?P<include_dir>[^;]+);?)+'
        c_decls:
            definitions:
                - 'void __assert(_Bool); /*lint !e793 !e955 !e970 !e1904 !e9141 */'
        cpp_decls:
            definitions:
                - 'void __assert(bool);  /*lint !e793 !e955 !e970 !e1904 !e9141 */'
        size_options:
            # To obtain the size of the fundamental types, the compiler is invoked with the arguments
            # provided below and the source file below is fed to the compiler via a temporary file.
            command:
                - "/nologo"
                - "/c"
            tempfile_associated:
                - ["(\\.[^\\\\/]+)?\\.[cp]+$", ".obj"]
                - ["^.*[\\\\/]([^\\\\/]+)(\\.[^.\\\\/]+)?\\.[cp]+$", "\\1.obj"]
            tempfile_type_c:    "c"
            tempfile_type_cpp:  "cpp"
            tempfile: |
                typedef int si;
                si  (*si_)[sizeof(int)] = 1;

                typedef short ss;
                ss  (*ss_)[sizeof(short)] = 1;

                typedef long sl;
                sl  (*sl_)[sizeof(long)] = 1;

                typedef long long sll;
                sll (*sll_)[sizeof(long long)] = 1;

                typedef float sf;
                sf  (*sf_)[sizeof(float)] = 1;

                typedef double sd;
                sd  (*sd_)[sizeof(double)] = 1;

                typedef long double sld;
                sld (*sld_)[sizeof(long double)] = 1;

                typedef char* sp;
                sp  (*sp_)[sizeof(char *)] = 1;

                typedef char sw;
                sw  (*sw_)[sizeof(L'a')] = 1;
            channel:    stdout
            match_expr: >-
                (?:.*?'(?P<size_name>si|sl|sll|ss|sw|sp|sf|sd|sld)[ (*)[]+(?P<size_value>\d+)\]')+

